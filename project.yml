name: KASH
options:
  bundleIdPrefix: com.kash.app
  deploymentTarget:
    iOS: 17.0
targets:
  KASH:
    type: application
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: KASH
        excludes:
          - Info.plist
      - path: Shared
    dependencies:
      - target: KASHWidgets
        embed: true
        codeSign: false
    info:
      path: KASH/Info.plist
      properties:
        CFBundleDisplayName: KASH
        CFBundleVersion: "5"
        CFBundleShortVersionString: "1.3.0"
        NSFaceIDUsageDescription: "KASH requiere autenticación biométrica para proteger tus datos financieros."
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.kash.app
            CFBundleURLSchemes:
              - kash
    settings:
      GENERATE_INFOPLIST_FILE: true
      INFOPLIST_FILE: KASH/Info.plist
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_NSFaceIDUsageDescription: "KASH requiere autenticación biométrica para proteger tus datos financieros."
      PRODUCT_BUNDLE_IDENTIFIER: com.kash.app
      CURRENT_PROJECT_VERSION: "5"
      MARKETING_VERSION: "1.3.0"
      INFOPLIST_KEY_CFBundleVersion: "5"
      INFOPLIST_KEY_CFBundleShortVersionString: "1.3.0"
      INFOPLIST_KEY_CFBundleDisplayName: KASH
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  KASHWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: KASHWidgets
        excludes:
          - Info.plist
      - path: KASH/Core/DesignSystem/ColorTokens.swift
      - path: KASH/Assets.xcassets
      - path: Shared
    info:
      path: KASHWidgets/Info.plist
      properties:
        CFBundleDisplayName: KASH
        CFBundleVersion: "5"
        CFBundleShortVersionString: "1.3.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.kash.app.widgets
      APPLICATION_EXTENSION_API_ONLY: YES
      SKIP_INSTALL: YES
      GENERATE_INFOPLIST_FILE: true
      INFOPLIST_FILE: KASHWidgets/Info.plist
      CURRENT_PROJECT_VERSION: "5"
      MARKETING_VERSION: "1.3.0"
      INFOPLIST_KEY_CFBundleVersion: "5"
      INFOPLIST_KEY_CFBundleShortVersionString: "1.3.0"
      INFOPLIST_KEY_CFBundleDisplayName: KASH
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  KASHTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: Tests/KASHTests
    dependencies:
      - target: KASH
    settings:
      GENERATE_INFOPLIST_FILE: true
      PRODUCT_BUNDLE_IDENTIFIER: com.kash.app.tests
