name: Build KASH iOS App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App on Cloud Mac
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cat << 'EOF' > project.yml
          name: KASH
          options:
            bundleIdPrefix: com.kash.app
            xcodeVersion: "15.4"
            minimumXcodeVersion: "15.0"
            deploymentTarget:
              iOS: 17.0
          targets:
            KASH:
              type: application
              platform: iOS
              deploymentTarget: 17.0
              sources:
                - KASH
              info:
                path: KASH/Info.plist
                properties:
                  CFBundleDisplayName: KASH
                  CFBundleIdentifier: com.kash.app
                  CFBundleShortVersionString: "1.0.0"
                  CFBundleVersion: "1"
                  UILaunchStoryboardName: LaunchScreen
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                  NSFaceIDUsageDescription: "KASH requiere Face ID para proteger tus datos financieros."
                  NSSupportsLiveActivities: true
          EOF
          xcodegen generate

      - name: Build App for iOS Simulator
        run: |
          xcodebuild build \
            -project KASH.xcodeproj \
            -scheme KASH \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create Zip Artifact
        run: |
          mkdir -p output
          cd build/Build/Products/Release-iphonesimulator
          zip -r ../../../output/KASH-iOS-Simulator.app.zip KASH.app

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KASH-iOS-Simulator-App
          path: output/KASH-iOS-Simulator.app.zip
          retention-days: 7
