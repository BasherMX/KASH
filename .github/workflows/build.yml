name: Build KASH iOS App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App on Cloud Mac
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inspect and Select Xcode Version
        run: |
          ls -d /Applications/Xcode*.app || true
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          fi
          xcode-select -p

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App for iOS Simulator
        run: |
          xcodebuild build \
            -project KASH.xcodeproj \
            -scheme KASH \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO > build_output.log 2>&1 || true

      - name: Print Xcode Build Log
        run: cat build_output.log

      - name: Verify Build Status
        run: |
          if grep -q "BUILD SUCCEEDED" build_output.log; then
            echo "BUILD SUCCEEDED"
          else
            echo "BUILD FAILED"
            exit 1
          fi

      - name: Create Zip Artifact
        run: |
          mkdir -p output
          cd build/Build/Products/Debug-iphonesimulator
          zip -r ../../../output/KASH-iOS-Simulator.app.zip KASH.app

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KASH-iOS-Simulator-App
          path: output/KASH-iOS-Simulator.app.zip
          retention-days: 7

      - name: Upload Failure Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: build_output.log
          retention-days: 1
