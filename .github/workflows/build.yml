name: Build KASH iOS App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App on Cloud Mac
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inspect and Select Xcode Version
        run: |
          ls -d /Applications/Xcode*.app || true
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          fi
          xcode-select -p

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project KASH.xcodeproj \
            -scheme KASH \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild_raw.log || {
              ERR_HEAD=$(head -n 15 xcodebuild_raw.log | tr '\n' ' ' | tr '"' "'")
              ERR_TAIL=$(tail -n 25 xcodebuild_raw.log | tr '\n' ' ' | tr '"' "'")
              echo "::error::HEAD: $ERR_HEAD"
              echo "::error::TAIL: $ERR_TAIL"
              exit 1
            }

      - name: Create Zip Artifact
        run: |
          mkdir -p output
          cd build/Build/Products/Debug-iphonesimulator
          zip -r ../../../output/KASH-iOS-Simulator.app.zip KASH.app

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KASH-iOS-Simulator-App
          path: output/KASH-iOS-Simulator.app.zip
          retention-days: 7
