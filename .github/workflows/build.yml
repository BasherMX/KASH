name: Build KASH iOS App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App on Cloud Mac
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cat << 'EOF' > project.yml
          name: KASH
          options:
            bundleIdPrefix: com.kash.app
            deploymentTarget:
              iOS: 17.0
          targets:
            KASH:
              type: application
              platform: iOS
              deploymentTarget: 17.0
              sources:
                - path: KASH
              info:
                path: KASH/Info.plist
                properties:
                  CFBundleDisplayName: KASH
                  CFBundleIdentifier: com.kash.app
                  CFBundleShortVersionString: "1.0.0"
                  CFBundleVersion: "1"
                  UILaunchStoryboardName: LaunchScreen
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                  NSFaceIDUsageDescription: "KASH requiere Face ID para proteger tus datos financieros."
            KASHWidgets:
              type: app-extension
              platform: iOS
              deploymentTarget: 17.0
              sources:
                - path: KASHWidgets
                - path: KASH/Models
                - path: KASH/Core/DesignSystem
              info:
                properties:
                  CFBundleDisplayName: KASH Widgets
                  CFBundleIdentifier: com.kash.app.widgets
                  CFBundleShortVersionString: "1.0.0"
                  CFBundleVersion: "1"
                  NSExtension:
                    NSExtensionPointIdentifier: com.apple.widgetkit-extension
          EOF
          xcodegen generate

      - name: Build App for iOS Simulator
        run: |
          xcodebuild build \
            -project KASH.xcodeproj \
            -scheme KASH \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create Zip Artifact
        run: |
          mkdir -p output
          cd build/Build/Products/Release-iphonesimulator
          zip -r ../../../output/KASH-iOS-Simulator.app.zip KASH.app

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KASH-iOS-Simulator-App
          path: output/KASH-iOS-Simulator.app.zip
          retention-days: 7
