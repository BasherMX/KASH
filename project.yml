name: KASH
options:
  bundleIdPrefix: com.kash.app
  deploymentTarget:
    iOS: 17.0
targets:
  KASH:
    type: application
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: KASH
        excludes:
          - Info.plist
          - KASH.entitlements
      - path: Shared
    dependencies:
      - target: KASHWidgets
        embed: true
        codeSign: false
    entitlements:
      path: KASH/KASH.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kash.app
    info:
      path: KASH/Info.plist
      properties:
        CFBundleDisplayName: KASH
        CFBundleVersion: "7"
        CFBundleShortVersionString: "1.5.0"
        NSFaceIDUsageDescription: "KASH requiere autenticación biométrica para proteger tus datos financieros."
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.kash.app
            CFBundleURLSchemes:
              - kash
    settings:
      GENERATE_INFOPLIST_FILE: true
      INFOPLIST_FILE: KASH/Info.plist
      CODE_SIGN_ENTITLEMENTS: KASH/KASH.entitlements
      INFOPLIST_KEY_NSFaceIDUsageDescription: "KASH requiere autenticación biométrica para proteger tus datos financieros."
      PRODUCT_BUNDLE_IDENTIFIER: com.kash.app
      CURRENT_PROJECT_VERSION: "7"
      MARKETING_VERSION: "1.5.0"
      INFOPLIST_KEY_CFBundleVersion: "7"
      INFOPLIST_KEY_CFBundleShortVersionString: "1.5.0"
      INFOPLIST_KEY_CFBundleDisplayName: KASH
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  KASHWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: KASHWidgets
        excludes:
          - Info.plist
          - KASHWidgets.entitlements
      - path: KASH/Core/DesignSystem/ColorTokens.swift
      - path: KASH/Assets.xcassets
      - path: Shared
    entitlements:
      path: KASHWidgets/KASHWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kash.app
    info:
      path: KASHWidgets/Info.plist
      properties:
        CFBundleDisplayName: KASH
        CFBundleVersion: "7"
        CFBundleShortVersionString: "1.5.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.kash.app.widgets
      CODE_SIGN_ENTITLEMENTS: KASHWidgets/KASHWidgets.entitlements
      APPLICATION_EXTENSION_API_ONLY: YES
      SKIP_INSTALL: YES
      GENERATE_INFOPLIST_FILE: true
      INFOPLIST_FILE: KASHWidgets/Info.plist
      CURRENT_PROJECT_VERSION: "7"
      MARKETING_VERSION: "1.5.0"
      INFOPLIST_KEY_CFBundleVersion: "7"
      INFOPLIST_KEY_CFBundleShortVersionString: "1.5.0"
      INFOPLIST_KEY_CFBundleDisplayName: KASH
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      LD_RUNPATH_SEARCH_PATHS:
        - "$(inherited)"
        - "@executable_path/Frameworks"
        - "@executable_path/../../Frameworks"

  KASHTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - path: Tests/KASHTests
    dependencies:
      - target: KASH
    entitlements:
      path: KASH/KASH.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kash.app
    settings:
      GENERATE_INFOPLIST_FILE: true
      CODE_SIGN_ENTITLEMENTS: KASH/KASH.entitlements
      PRODUCT_BUNDLE_IDENTIFIER: com.kash.app.tests
