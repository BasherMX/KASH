name: Build KASH iOS App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App on Cloud Mac
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inspect and Select Xcode Version
        run: |
          xcode-select -p

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project KASH.xcodeproj \
            -scheme KASH \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild_raw.log || {
              ERR_LINES=$(grep -E ": error:|error:" xcodebuild_raw.log | head -n 20 | tr '\n' ' | ' | tr '"' "'")
              echo "::error::SWIFT COMPILER ERRORS: $ERR_LINES"
              exit 1
            }

      - name: Build and Run Unit Tests on iOS Simulator
        run: |
          set -o pipefail
          SIM_UDID=$(xcrun simctl list devices available -j | python3 -c "import sys, json; devs = json.load(sys.stdin)['devices']; print(next(d['udid'] for k, v in devs.items() if 'iOS' in k for d in v if d.get('isAvailable')))")
          echo "Using Simulator UDID: $SIM_UDID"
          xcodebuild test \
            -project KASH.xcodeproj \
            -scheme KASH \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild_test.log || {
              echo "::warning::Unit tests output:"
              grep -E "Test|failed|passed|Expectation" xcodebuild_test.log | tail -n 40 || true
              exit 1
            }

          echo "=== Verifying WidgetKit Extension Registration on iOS Simulator ==="
          SIM_APP_PATH=$(find build/Build/Products -name "KASH.app" -type d | grep -i "iphonesimulator" | head -n 1)
          if [ -n "$SIM_APP_PATH" ]; then
            xcrun simctl boot "$SIM_UDID" 2>/dev/null || true
            xcrun simctl install "$SIM_UDID" "$SIM_APP_PATH"
            xcrun simctl spawn "$SIM_UDID" pluginkit -m -v -i com.kash.app.widgets || true
          fi

      - name: Create Zip Artifact
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output"
          APP_PATH=$(find build -name "KASH.app" -type d | head -n 1)
          echo "Found built app at: $APP_PATH"
          /usr/libexec/PlistBuddy -c "Set :NSFaceIDUsageDescription 'KASH requiere autenticación biométrica para proteger tus datos financieros.'" "$APP_PATH/Info.plist" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string 'KASH requiere autenticación biométrica para proteger tus datos financieros.'" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion '7'" "$APP_PATH/Info.plist" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string '7'" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString '1.5.0'" "$APP_PATH/Info.plist" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string '1.5.0'" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :UILaunchScreen" "$APP_PATH/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UILaunchScreen dict" "$APP_PATH/Info.plist" 2>/dev/null || true

          for APPEX in "$APP_PATH/PlugIns/"*.appex; do
            if [ -d "$APPEX" ]; then
              /usr/libexec/PlistBuddy -c "Set :CFBundleVersion '7'" "$APPEX/Info.plist" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string '7'" "$APPEX/Info.plist"
              /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString '1.5.0'" "$APPEX/Info.plist" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string '1.5.0'" "$APPEX/Info.plist"
              /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'KASH'" "$APPEX/Info.plist" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'KASH'" "$APPEX/Info.plist"
            fi
          done

          cd "$(dirname "$APP_PATH")"
          zip -r "$GITHUB_WORKSPACE/output/KASH-iOS-Simulator.app.zip" "KASH.app"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KASH-iOS-Simulator-App
          path: output/KASH-iOS-Simulator.app.zip
          retention-days: 7

      - name: Build App for Physical Device (ARM64)
        run: |
          set -o pipefail
          xcodebuild build \
            -project KASH.xcodeproj \
            -scheme KASH \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build_device \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild_device.log || {
              ERR_LINES=$(grep -E ": error:|error:" xcodebuild_device.log | head -n 20 | tr '\n' ' | ' | tr '"' "'")
              echo "::error::DEVICE BUILD ERRORS: $ERR_LINES"
              exit 1
            }

      - name: Package IPA for Sideloading
        run: |
          mkdir -p Payload
          DEVICE_APP=$(find build_device/Build/Products -name "KASH.app" -type d | head -n 1)
          echo "Found Device App at: $DEVICE_APP"

          # 1. Main App Info.plist adjustments
          /usr/libexec/PlistBuddy -c "Set :NSFaceIDUsageDescription 'KASH requiere autenticación biométrica para proteger tus datos financieros.'" "$DEVICE_APP/Info.plist" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string 'KASH requiere autenticación biométrica para proteger tus datos financieros.'" "$DEVICE_APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion '7'" "$DEVICE_APP/Info.plist" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string '7'" "$DEVICE_APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString '1.5.0'" "$DEVICE_APP/Info.plist" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string '1.5.0'" "$DEVICE_APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :UILaunchScreen" "$DEVICE_APP/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UILaunchScreen dict" "$DEVICE_APP/Info.plist" 2>/dev/null || true

          echo "=== Main App Info.plist ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$DEVICE_APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$DEVICE_APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$DEVICE_APP/Info.plist"

          # 2. App Extensions Info.plist adjustments & Ad-Hoc Signing with Entitlements
          for APPEX in "$DEVICE_APP/PlugIns/"*.appex; do
            if [ -d "$APPEX" ]; then
              echo "=== Configuring App Extension: $APPEX ==="
              /usr/libexec/PlistBuddy -c "Set :CFBundleVersion '7'" "$APPEX/Info.plist" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string '7'" "$APPEX/Info.plist"
              /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString '1.5.0'" "$APPEX/Info.plist" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string '1.5.0'" "$APPEX/Info.plist"
              /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'KASH'" "$APPEX/Info.plist" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'KASH'" "$APPEX/Info.plist"
              echo "Extension Bundle ID: $(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APPEX/Info.plist")"
              echo "Extension CFBundleVersion: $(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APPEX/Info.plist")"
              echo "Extension CFBundleShortVersionString: $(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APPEX/Info.plist")"
              codesign --force --sign - --entitlements "$GITHUB_WORKSPACE/KASHWidgets/KASHWidgets.entitlements" --timestamp=none "$APPEX"
              codesign -d --entitlements :- "$APPEX" || true
            fi
          done

          codesign --force --sign - --entitlements "$GITHUB_WORKSPACE/KASH/KASH.entitlements" --timestamp=none "$DEVICE_APP"
          codesign -d --entitlements :- "$DEVICE_APP" || true

          cp -R "$DEVICE_APP" Payload/
          zip -r "$GITHUB_WORKSPACE/output/KASH.ipa" Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KASH-iOS-IPA
          path: output/KASH.ipa
          retention-days: 7
